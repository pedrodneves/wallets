<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canton Wallet Directory</title>
  <meta name="description" content="Canton Network wallet providers, the features they support, and the public evidence behind each claim.">
  <meta name="theme-color" content="#03030a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)">
  <!-- Canton "C" favicon, same file as sv-cal.canton.foundation -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <!-- Inter + JetBrains Mono, same fonts as the SV Calendar site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Apply the saved theme before the page paints (dark is the default) -->
  <script>
    try { if (localStorage.getItem("wallets-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
  <!-- Bump ?v= when styles.css or app.js change, to bust browser caches -->
  <link rel="stylesheet" href="assets/styles.css?v=4">
</head>
<body data-page="directory">
  <a class="skip" href="#main">Skip to content</a>
  <!-- Header and footer are drawn by app.js so all pages share one nav -->
  <header class="site-header" id="site-header"></header>
  <main id="main"><div class="wrap state-msg">Loading wallet data…</div></main>
  <footer class="site-footer" id="site-footer"></footer>
  <noscript><div class="wrap state-msg">This site needs JavaScript. The same data is in <a href="https://github.com/canton-foundation/wallets/blob/main/WALLET_DIRECTORY.md">WALLET_DIRECTORY.md</a>.</div></noscript>
  <script src="assets/app.js?v=4"></script>
</body>
</html>
